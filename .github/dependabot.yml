version: 2
multi-ecosystem-groups:
  biu-dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: biu-dependencies
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: biu-dependencies
    open-pull-requests-limit: 1
